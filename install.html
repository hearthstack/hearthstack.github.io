<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hearthstack Kitchen — Install</title>
<meta name="description" content="Install Hearthstack Kitchen in about 35 minutes. No coding.">
<style>
  :root{--ink:#2a241c;--paper:#faf7f1;--card:#fff;--line:#e5ddd0;--flame:#c46a2e;--jade:#5e8c4a;--dim:#8a7f6e;--code:#f2ede3;--warn:#a33f2b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:-apple-system,"Segoe UI","Noto Sans",sans-serif;font-size:16px;line-height:1.65;padding:26px 16px 70px}
  body[lang="zh-Hant"]{font-family:-apple-system,"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.8}
  .wrap{max-width:560px;margin:0 auto}
  .langbar{display:flex;gap:6px;justify-content:flex-end;margin-bottom:14px}
  .langbar button{border:1px solid var(--line);background:#fff;color:var(--dim);border-radius:999px;padding:5px 15px;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .15s}
  .langbar button[aria-pressed="true"]{background:var(--flame);color:#fff;border-color:var(--flame)}
  .langbar button:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
  .brand{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--flame);font-weight:700}
  h1{font-size:27px;margin:4px 0 6px;font-weight:800}
  .lead{color:var(--dim);font-size:14.5px}
  .honest{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--jade);border-radius:8px;padding:12px 14px;margin:16px 0;font-size:14px}
  .step{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}
  .step .n{display:inline-block;background:var(--flame);color:#fff;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;font-weight:800;font-size:14px;margin-right:8px}
  .step b.t{font-size:16.5px}
  .step .time{float:right;color:var(--dim);font-size:12.5px;margin-top:4px}
  .step p{font-size:14px;margin:8px 0;color:#4a4238}
  .btn{display:block;text-align:center;background:var(--flame);color:#fff;text-decoration:none;font-weight:800;font-size:16px;border-radius:9px;padding:14px;margin:10px 0 4px}
  .paste{background:var(--code);border:1px dashed var(--line);border-radius:6px;padding:8px 10px;font-size:13px;margin:6px 0}
  code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--code);border-radius:3px;padding:1px 5px}
  .need{font-size:13px;color:var(--dim);margin-top:6px}
  .warn{background:#fdf1ec;border-left:4px solid var(--warn);border-radius:6px;padding:10px 12px;font-size:13.5px;margin:10px 0}
  details{margin:8px 0;font-size:14px}
  summary{color:var(--flame);font-weight:700;cursor:pointer}
  footer{margin-top:36px;padding-top:14px;border-top:2px solid var(--line);color:var(--dim);font-size:12.5px}
  a{color:var(--flame)}
</style>
</head>
<body lang="en">
<div class="wrap">
  <div class="langbar" role="group" aria-label="Language / 語言">
    <button type="button" data-set="en" aria-pressed="true">English</button>
    <button type="button" data-set="zh" aria-pressed="false">繁體中文</button>
  </div>

  <div class="brand">Hearthstack Kitchen</div>
  <h1 data-i="h1"></h1>
  <p class="lead" data-i="lead"></p>

  <div class="honest" data-i="timing"></div>
  <div class="honest" data-i="tip"></div>

  <div class="step">
    <span class="n">1</span><b class="t" data-i="s1t"></b><span class="time" data-i="s1time"></span>
    <p data-i="s1p"></p>
    <a class="btn" href="https://ballistic-value-78b.notion.site/Hearthstack-Kitchen-Template-Master-v1-0-3b14677587658185ae92d598b6e6c6a3" data-i="s1btn"></a>
    <p class="need" data-i="s1need"></p>
    <details><summary data-i="s1ds"></summary><p data-i="s1dp"></p></details>
  </div>

  <div class="step">
    <span class="n">2</span><b class="t" data-i="s2t"></b><span class="time" data-i="s2time"></span>
    <p data-i="s2p"></p>
    <a class="btn" href="https://t.me/BotFather" data-i="s2btn"></a>
    <p class="need" data-i="s2need"></p>
  </div>

  <div class="step">
    <span class="n">3</span><b class="t" data-i="s3t"></b><span class="time" data-i="s3time"></span>
    <p data-i="s3p"></p>
    <a class="btn" href="https://ap-southeast-1.console.aws.amazon.com/cloudformation/home?region=ap-southeast-1#/stacks/quickcreate?templateURL=https%3A%2F%2Fhearthstack-dist.s3.ap-southeast-1.amazonaws.com%2Fhearthstack-kitchen_cfn_v1.yaml&stackName=hearthstack-kitchen" data-i="s3btn"></a>
    <p class="need" data-i="s3need"></p>
    <details><summary data-i="s3ds1"></summary><p data-i="s3dp1"></p></details>
    <details><summary data-i="s3ds2"></summary><p data-i="s3dp2"></p></details>
    <div class="warn" data-i="s3warn"></div>
  </div>

  <div class="step">
    <span class="n">4</span><b class="t" data-i="s4t"></b><span class="time" data-i="s4time"></span>
    <p data-i="s4p"></p>
    <div class="paste" data-i="s4paste"></div>
  </div>

  <div class="step">
    <span class="n">5</span><b class="t" data-i="s5t"></b><span class="time" data-i="s5time"></span>
    <p data-i="s5p1"></p>
    <p data-i="s5p2"></p>
    <div class="warn" data-i="s5warn"></div>
    <details><summary data-i="s5ds"></summary><p data-i="s5dp"></p></details>
  </div>

  <div class="honest" data-i="done"></div>
  <footer data-i="foot"></footer>
</div>

<script>
const I18N = {
en:{
 h1:"Let's set up your kitchen 🏮",

 tip:"💡 <b>One tip before you start:</b> where possible, use the <b>same Google account</b> for your Notion sign-in and your AI key — fewer accounts to remember. Different accounts work fine too; just note which one holds what.",
 s1t:"Get your Notion workspace", s1time:"15 min · usable now",
 s1p:"Tap the button, then tap <b>Duplicate</b> (top-right). That's your whole kitchen database — menus, pantry, recipes — with sample data so every screen makes sense. All 87 recipes ship in four languages: 中文, English, Tagalog and Bahasa Indonesia.",
 s1btn:"📄 Duplicate the template",

 s1ds:"Then connect it (2 taps — needed for Step 4)",
 s1dp:"1. Go to <a href='https://www.notion.so/profile/integrations'>notion.so/profile/integrations</a> → <b>New integration</b> → name it <code>hearthstack</code> → Save → copy the <b>secret</b> (starts with <code>ntn_</code>).<br>2. Open your duplicated page → <b>•••</b> (top-right) → <b>Connections</b> → connect <code>hearthstack</code>. Keep the secret for Step 3.",
 s2t:"Create your family's bot", s2time:"3 min",
 s2p:"Tap to open <b>@BotFather</b> in Telegram → send <code>/newbot</code> → give it a name (e.g. <i>Our Kitchen</i>) and a username ending in <code>bot</code>. Copy the <b>token</b> it replies with.",
 s2btn:"🤖 Open BotFather",
 s2need:"Needs: Telegram, which your family will use daily anyway.",
 s3t:"Launch your engine on AWS", s3time:"10 min",
 s3p:"One tap opens AWS with everything pre-configured. Sign in, paste your <b>bot token</b> and <b>Notion secret</b> (and your free AI key if you have one — optional), tick the acknowledgement box, tap <b>Create stack</b>. AWS builds the whole engine for you.",
 s3btn:"🚀 Launch on AWS",

 s3ds1:"Optional: free AI key for auto menu drafting (5 min)",

 s4p:"Open your <b>SetupDoctorUrl</b> from the Outputs tab. The Doctor checks all seven layers top-down, fixes what it can by itself, and tells you exactly what to tap if anything's red. Then open your bot in Telegram and send your <b>PairingCode</b> — you're the Admin. Family members send <code>/start</code> and you approve them with one tap.",

 s5p2:"Optional: tap <b>🔥 熱量目標</b> to set a daily calorie target per person. Everyone still eats the same dishes — the system writes a per-person portion adjustment instead of cooking separate meals.",
 s5warn:"<b>Please read:</b> the allergy filter is a <b>planning aid, not a safety guarantee</b>. Always read the ingredients yourself before cooking and serving. Sauces hide allergens — oyster sauce contains shellfish, wheat and soy; fish sauce and dashi contain fish; kimchi usually contains shrimp paste.",
 s5ds:"Why flavour never suffers",
 s5dp:"The engine is instructed that cutting seasoning, spices or steps to save calories is a <b>failure</b>. It must use technique instead — less sugar, no thickening, steaming or roasting rather than deep-frying, leaner cuts, sauce served on the side, more umami to compensate. Every dish keeps its chef's tip.",

 foot:"Hearthstack Kitchen · engine v1.6.7 · Personal-use licence — one purchase, one household · <a href='https://hearthstack.github.io'>FAQ / Changelog</a><br>Your data lives in your Notion and your AWS. We couldn't see it even if we wanted to."
},
zh:{

 s3ds1:"選填：申請免費 AI 金鑰以自動編排菜單（5 分鐘）",

 s5warn:"<b>請細閱：</b>過敏過濾為<b>編餐輔助，並非安全保證</b>。採購及烹調前請務必自行核對成分。醬料常藏過敏原：蠔油含甲殼類、麩質及大豆；魚露及日式高湯含魚類；泡菜通常含蝦醬。",

 foot:"Hearthstack Kitchen・引擎 v1.6.7・個人使用授權：一次購買，一個家庭・<a href='https://hearthstack.github.io'>常見問題／版本紀錄</a><br>你的資料存放於你自己的 Notion 及 AWS，本方縱使有意亦無從查閱。"

(function(){
  var btns=[].slice.call(document.querySelectorAll('.langbar button'));
  function set(l){
    var d=I18N[l]; if(!d) return;
    document.querySelectorAll('[data-i]').forEach(function(el){
      var v=d[el.getAttribute('data-i')]; if(v!==undefined) el.innerHTML=v;
    });
    document.body.lang = (l==='zh' ? 'zh-Hant' : 'en');
    document.documentElement.lang = document.body.lang;
    document.title = (l==='zh' ? "Hearthstack Kitchen — 安裝指引" : "Hearthstack Kitchen — Install");
    btns.forEach(function(x){ x.setAttribute('aria-pressed', x.dataset.set===l?'true':'false'); });
    try{ localStorage.setItem('hs_lang', l); }catch(e){}
  }
  btns.forEach(function(x){ x.addEventListener('click', function(){ set(x.dataset.set); }); });
  var saved=null; try{ saved=localStorage.getItem('hs_lang'); }catch(e){}
  set(saved || (/^zh/i.test(navigator.language||'') ? 'zh' : 'en'));
})();
</script>
</body>
</html>
