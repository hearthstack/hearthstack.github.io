<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hearthstack Kitchen — Setup Wizard</title>
<style>
  :root{--ink:#2a241c;--paper:#faf7f1;--card:#fff;--line:#e5ddd0;--flame:#c46a2e;--jade:#5e8c4a;--dim:#8a7f6e;--code:#f2ede3;--warn:#a33f2b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:-apple-system,"Segoe UI","Noto Sans",sans-serif;font-size:15px;line-height:1.6;padding:26px 16px 60px}
  body[lang="zh-Hant"]{font-family:-apple-system,"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.8}
  .wrap{max-width:720px;margin:0 auto}
  .langbar{display:flex;gap:6px;justify-content:flex-end;margin-bottom:14px}
  .langbar button{border:1px solid var(--line);background:#fff;color:var(--dim);border-radius:999px;padding:5px 15px;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .15s}
  .langbar button[aria-pressed="true"]{background:var(--flame);color:#fff;border-color:var(--flame)}
  .langbar button:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
  .brand{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--flame);font-weight:700}
  h1{font-size:26px;margin:4px 0 2px}
  .sub{color:var(--dim);font-size:13.5px;margin-bottom:6px}
  .priv{font-size:12.5px;color:var(--jade);margin-bottom:20px}
  .card{border:1px solid var(--line);border-radius:10px;background:var(--card);margin:16px 0;overflow:hidden}
  .card-h{background:var(--code);padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .card-h .n{font-weight:800;font-size:14px;color:var(--flame)}
  .card-h .t{font-weight:700;font-size:14.5px}
  .card-b{padding:14px 16px}
  label{display:block;margin:10px 0 4px;font-size:13.5px;font-weight:600}
  label:first-child{margin-top:0}
  .hint{font-size:12px;color:var(--dim);margin:2px 0 6px;line-height:1.55}
  input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit;background:#fffdf9}
  textarea{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>div{flex:1;min-width:170px}
  .chk{display:flex;align-items:center;gap:9px;margin:7px 0}
  .chk input{width:17px;height:17px;flex:none}
  .chk span{font-size:14px}
  .disc{background:#fdf6ec;border:1px solid #ecd9b8;border-left:4px solid var(--flame);border-radius:6px;padding:10px 12px;font-size:12.5px;margin:10px 0;line-height:1.6}
  .safety{background:#fdf1ec;border:1px solid #f0cfc2;border-left:4px solid var(--warn);border-radius:6px;padding:10px 12px;font-size:12.5px;margin:10px 0;line-height:1.6}
  button{cursor:pointer;border:none;border-radius:7px;padding:10px 18px;font-size:14px;font-weight:700}
  .go{background:var(--flame);color:#fff;width:100%;margin:18px 0 6px;padding:14px;font-size:16px}
  .copy{background:var(--code);border:1px solid var(--line);font-size:12px;padding:4px 10px;font-weight:600}
  .copy.done{background:var(--jade);color:#fff;border-color:var(--jade)}
  h2{font-size:19px;margin:26px 0 8px}
  table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
  th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:middle}
  th{background:var(--code);font-size:11.5px;text-transform:uppercase}
  td code{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
  #out{display:none}
  ol.cl{margin-left:20px}
  ol.cl li{margin:6px 0;font-size:13.5px}
  .muted{color:var(--dim)}
  .agrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  @media(max-width:520px){.agrid{grid-template-columns:1fr}}
  .kperson{display:flex;gap:8px;margin:6px 0;align-items:center}
  .kperson input[type=text]{flex:2}
  .kperson input[type=number]{flex:1}
  .kperson button{background:var(--code);border:1px solid var(--line);padding:6px 10px;font-size:12px}
</style>
</head>
<body lang="en">
<div class="wrap">
  <div class="langbar" role="group" aria-label="Language / 語言">
    <button type="button" data-set="en" aria-pressed="true">English</button>
    <button type="button" data-set="zh" aria-pressed="false">繁體中文</button>
  </div>

  <div class="brand">Hearthstack</div>
  <h1 data-i="h1"></h1>
  <div class="sub" data-i="sub"></div>
  <div class="priv" data-i="priv"></div>

  <div class="card"><div class="card-h"><span class="n">1</span><span class="t" data-i="c1"></span></div><div class="card-b">
    <select id="q1" onchange="setGeo()">
      <option value="8|hk|22.32|114.17" data-i="opt_hk"></option>
      <option value="8|sg|1.35|103.82" data-i="opt_sg"></option>
      <option value="8|my|3.14|101.69" data-i="opt_my"></option>
      <option value="8|tw|25.03|121.57" data-i="opt_tw"></option>
      <option value="4|gulf|25.20|55.27" data-i="opt_ae"></option>
      <option value="3|gulf|24.71|46.68" data-i="opt_sa"></option>
      <option value="8|other||" data-i="opt_other"></option>
    </select>
    <div class="row" style="margin-top:8px">
      <div><label data-i="lat"></label><input type="text" id="lat"></div>
      <div><label data-i="lon"></label><input type="text" id="lon"></div>
    </div>
    <div class="hint" data-i="geo_hint"></div>
  </div></div>

  <div class="card"><div class="card-h"><span class="n">2</span><span class="t" data-i="c2"></span></div><div class="card-b">
    <div class="chk"><input type="checkbox" id="hasPartner" checked><span data-i="partner"></span></div>
    <div class="chk"><input type="checkbox" id="hasHelper" checked><span data-i="helper"></span></div>
    <label data-i="helper_lang"></label>
    <select id="helperLang">
      <option value="EN">English</option>
      <option value="TL" data-i="lang_tl"></option>
      <option value="ID" data-i="lang_id"></option>
      <option value="ZH" data-i="lang_zh"></option>
    </select>
    <div class="hint" data-i="helper_hint"></div>
    <label data-i="portions"></label>
    <input type="number" id="portions" value="4" min="1" max="12">
    <div class="hint" data-i="portions_hint"></div>
  </div></div>

  <div class="card"><div class="card-h"><span class="n">3</span><span class="t" data-i="c3"></span></div><div class="card-b">
    <label data-i="ag_label"></label>
    <div class="agrid" id="agBox"></div>
    <div class="safety" data-i="ag_safety"></div>
    <label data-i="dg_label"></label>
    <div class="agrid" id="dgBox"></div>
    <div class="hint" data-i="dg_hint"></div>
    <label style="margin-top:14px" data-i="avoid_label"></label>
    <input type="text" id="avoid" data-ph="avoid_ph">
    <div class="hint" data-i="avoid_hint"></div>
  </div></div>

  <div class="card"><div class="card-h"><span class="n">4</span><span class="t" data-i="c4"></span></div><div class="card-b">
    <div id="kBox"></div>
    <button class="copy" onclick="addPerson()" data-i="add_person"></button>
    <div class="hint" style="margin-top:8px" data-i="kcal_ref"></div>
    <div class="safety" data-i="kcal_how"></div>
    <div class="hint" data-i="kcal_floor"></div>
  </div></div>

  <div class="card"><div class="card-h"><span class="n">5</span><span class="t" data-i="c5"></span></div><div class="card-b">
    <div class="row">
      <div><label data-i="lunchbox"></label><select id="lunchbox"><option value="yes" data-i="yes"></option><option value="no" selected data-i="no"></option></select></div>
      <div><label data-i="soup"></label><select id="soup"><option value="yes" selected data-i="soup_yes"></option><option value="no" data-i="no"></option></select></div>
      <div><label data-i="spice"></label><select id="spice"><option value="none" data-i="spice_none"></option><option value="mild" selected data-i="spice_mild"></option><option value="hot" data-i="spice_hot"></option></select></div>
    </div>
    <label data-i="notes"></label>
    <input type="text" id="notes" data-ph="notes_ph">
  </div></div>

  <div class="card"><div class="card-h"><span class="n">6</span><span class="t" data-i="c6"></span></div><div class="card-b">
    <select id="shopday">
      <option value="" data-i="shop_skip"></option>
      <option value="1" data-i="tue"></option><option value="2" data-i="wed"></option>
      <option value="3" data-i="thu"></option><option value="4" data-i="fri"></option><option value="5" data-i="sat"></option>
    </select>
  </div></div>

  <div class="card"><div class="card-h"><span class="n">7</span><span class="t" data-i="c7"></span></div><div class="card-b">
    <label data-i="provider"></label>
    <select id="aiProvider" onchange="aiUi()">
      <option value="gemini" selected data-i="prov_gemini"></option>
      <option value="anthropic" data-i="prov_anthropic"></option>
      <option value="openai_compat" data-i="prov_openai"></option>
      <option value="none" data-i="prov_none"></option>
    </select>
    <div class="disc" data-i="ai_honest"></div>
    <div id="aiKeyRow">
      <label data-i="api_key"></label>
      <input type="password" id="llmKey" data-ph="api_key_ph">
      <label data-i="model"></label>
      <input type="text" id="llmModel" data-ph="model_ph">
      <div class="hint" data-i="model_hint"></div>
    </div>
  </div></div>

  <div class="card"><div class="card-h"><span class="n">8</span><span class="t" data-i="c8"></span></div><div class="card-b">
    <label data-i="bot_token"></label><input type="password" id="tgToken" placeholder="7213456789:AAF...">
    <div class="hint" data-i="bot_hint"></div>
  </div></div>

  <div class="card"><div class="card-h"><span class="n">9</span><span class="t" data-i="c9"></span></div><div class="card-b">
    <label data-i="nt_secret"></label><input type="password" id="ntToken" placeholder="ntn_... / secret_...">
    <div class="hint" data-i="nt_hint"></div>
  </div></div>

  <div class="card"><div class="card-h"><span class="n">10</span><span class="t" data-i="c10"></span></div><div class="card-b">
    <input type="text" id="fnUrl" placeholder="https://xxxx.lambda-url.ap-southeast-1.on.aws/">
    <div class="hint" data-i="fn_hint"></div>
  </div></div>

  <button class="go" onclick="build()" data-i="generate"></button>

  <div id="out">
    <h2 data-i="out1"></h2>
    <div class="disc" data-i="out1_hint"></div>
    <table id="envTable"></table>
    <h2 data-i="out2"></h2>
    <textarea id="prefs" rows="7" readonly></textarea>
    <button class="copy" onclick="cp(this,document.getElementById('prefs').value)" data-i="copy_prefs"></button>
    <h2 data-i="out3"></h2>
    <ol class="cl" id="checklist"></ol>
  </div>
</div>

var LANG = "en";
function T(k){ return I18N[LANG][k]; }

function mkChk(box, list, labelKey, prefix){
  var el=document.getElementById(box), labels=I18N[LANG][labelKey], keep={};
  [].slice.call(el.querySelectorAll("input")).forEach(function(i){ keep[i.value]=i.checked; });
  el.innerHTML="";
  list.forEach(function(name,i){
    var d=document.createElement("div"); d.className="chk";
    d.innerHTML='<input type="checkbox" id="'+prefix+i+'" value="'+name+'"><span>'+labels[name]+'</span>';
    el.appendChild(d);
    if(keep[name]) document.getElementById(prefix+i).checked=true;
  });
}
function picked(prefix,list){ return list.filter(function(_,i){ return document.getElementById(prefix+i).checked; }); }
var kIdx=0;
function addPerson(name,val){
  var box=document.getElementById("kBox"), i=kIdx++;
  var d=document.createElement("div"); d.className="kperson";
  d.innerHTML='<input type="text" id="kn'+i+'" data-ph="kn_ph" value="'+(name||"")+'">'+
    '<input type="number" id="kv'+i+'" data-ph="kv_ph" min="1200" max="5000" value="'+(val||"")+'">'+
    '<button onclick="this.parentNode.remove()">✕</button>';
  box.appendChild(d);
  d.querySelector('input[type=text]').placeholder = (LANG==="zh"?"稱呼，例如：爸爸":"Name, e.g. Dad");
  d.querySelector('input[type=number]').placeholder = (LANG==="zh"?"kcal／日":"kcal/day");
}
function setGeo(){
  var p=document.getElementById("q1").value.split("|");
  document.getElementById("lat").value=p[2]||"";
  document.getElementById("lon").value=p[3]||"";
}
function rand(n){var c="abcdefghjkmnpqrstuvwxyz23456789ABCDEFGHJKMNPQRSTUVWXYZ",s="",a=new Uint32Array(n);crypto.getRandomValues(a);for(var i=0;i<n;i++)s+=c[a[i]%c.length];return s}
function cp(btn,val){navigator.clipboard.writeText(val).then(function(){var o=btn.textContent;btn.classList.add("done");btn.textContent="✓";setTimeout(function(){btn.classList.remove("done");btn.textContent=o},1500)})}
function aiUi(){document.getElementById("aiKeyRow").style.display=document.getElementById("aiProvider").value==="none"?"none":"block"}

function build(){
  var parts=document.getElementById("q1").value.split("|"), tz=parts[0], market=parts[1];
  var hasP=document.getElementById("hasPartner").checked, hasH=document.getElementById("hasHelper").checked;
  var prov=document.getElementById("aiProvider").value;

  var caps={}, tooLow=false;
  [].slice.call(document.querySelectorAll("#kBox .kperson")).forEach(function(r){
    var n=r.querySelector('input[type=text]').value.trim(), v=Number(r.querySelector('input[type=number]').value);
    if(n&&v>0){ if(v<1200) tooLow=true; else caps[n]=v; }
  });
  if(tooLow) alert(T("alert_low"));

  var prefs={
    cuisine_market:market,
    avoid:document.getElementById("avoid").value||"none",
    lunchbox:document.getElementById("lunchbox").value,
    soup:document.getElementById("soup").value,
    spice:document.getElementById("spice").value,
    notes:document.getElementById("notes").value||"",
    portions:Number(document.getElementById("portions").value)||4,
    allergens:picked("ag",ALLERGENS),
    diet_block:picked("dg",DIET_TAGS),
    kcal_caps:caps,
    kcal_dinner_share:1/3
  };
  var provMap={gemini:"gemini",anthropic:"anthropic",openai_compat:"openai"};
  var fnUrl=document.getElementById("fnUrl").value;
  var rows=[
    ["TELEGRAM_TOKEN",document.getElementById("tgToken").value],
    ["TG_WEBHOOK_SECRET",rand(24)],
    ["PAIR_CODE",rand(8)],
    ["NOTION_TOKEN",document.getElementById("ntToken").value],
    ["DASH_KEY",rand(20)],
    ["DASH_URL",fnUrl],
    ["TZ_OFFSET_HOURS",tz],
    ["HELPER_LANG",document.getElementById("helperLang").value],
    ["PORTIONS",String(prefs.portions)],
    ["FAMILY_PREFS",JSON.stringify(prefs)],
    document.getElementById("lat").value?["LAT",document.getElementById("lat").value]:null,
    document.getElementById("lon").value?["LON",document.getElementById("lon").value]:null,
    ["UPDATE_URL","https://hearthstack-dist.s3.ap-southeast-1.amazonaws.com/hearthstack-kitchen.zip"],
    prov!=="none"?["LLM_PROVIDER",provMap[prov]]:null,
    prov!=="none"?["LLM_API_KEY",document.getElementById("llmKey").value||""]:null,
    (prov!=="none"&&document.getElementById("llmModel").value)?["LLM_MODEL",document.getElementById("llmModel").value]:null,
    document.getElementById("shopday").value?["SHOP_DAY_2",document.getElementById("shopday").value]:null
  ].filter(Boolean);

  var t=document.getElementById("envTable");
  t.innerHTML="<tr><th>"+T("th_key")+"</th><th>"+T("th_val")+"</th><th></th></tr>";
  rows.forEach(function(kv){
    var tr=document.createElement("tr");
    tr.innerHTML="<td><code>"+kv[0]+"</code></td><td><code>"+(kv[1]?String(kv[1]).replace(/</g,"&lt;"):"<span class='muted'>"+T("add_later")+"</span>")+"</code></td><td></td>";
    var b=document.createElement("button"); b.className="copy"; b.textContent="Copy";
    b.onclick=function(){cp(b,kv[1]||"")};
    tr.lastElementChild.appendChild(b); t.appendChild(tr);
  });
  var tr=document.createElement("tr");
  tr.innerHTML="<td><code>PORTION_FACTOR</code></td><td class='muted' style='font-size:12px'>"+T("pf_note")+"</td><td></td>";
  t.appendChild(tr);

  document.getElementById("prefs").value=JSON.stringify(prefs,null,1);

  var blocked=prefs.allergens.concat(prefs.diet_block);
  var steps=[T("cl1"),T("cl2"),T("cl3"),T("cl4"),
    T("cl5")+((hasP||hasH)?T("cl5b"):""),
    blocked.length?(T("cl6")+blocked.join("、")):T("cl6b"),
    Object.keys(caps).length?T("cl7"):null,
    prov!=="none"?T("cl8"):T("cl8b"),
    T("cl9")].filter(Boolean);
  var cl=document.getElementById("checklist"); cl.innerHTML="";
  steps.forEach(function(s){ var li=document.createElement("li"); li.textContent=s; cl.appendChild(li); });

  document.getElementById("out").style.display="block";
  window.scrollTo({top:document.getElementById("out").offsetTop-10,behavior:"smooth"});
}

(function(){
  var btns=[].slice.call(document.querySelectorAll(".langbar button"));
  function set(l){
    if(!I18N[l]) return; LANG=l;
    document.querySelectorAll("[data-i]").forEach(function(el){
      var v=I18N[l][el.getAttribute("data-i")]; if(v!==undefined) el.innerHTML=v;
    });
    document.querySelectorAll("[data-ph]").forEach(function(el){
      var v=I18N[l][el.getAttribute("data-ph")]; if(v!==undefined) el.placeholder=v;
    });
    mkChk("agBox",ALLERGENS,"_agl","ag");
    mkChk("dgBox",DIET_TAGS,"_dgl","dg");
    [].slice.call(document.querySelectorAll("#kBox .kperson")).forEach(function(d){
      d.querySelector('input[type=text]').placeholder=(l==="zh"?"稱呼，例如：爸爸":"Name, e.g. Dad");
      d.querySelector('input[type=number]').placeholder=(l==="zh"?"kcal／日":"kcal/day");
    });
    document.body.lang=(l==="zh"?"zh-Hant":"en");
    document.documentElement.lang=document.body.lang;
    document.title=(l==="zh"?"Hearthstack Kitchen — 設定精靈":"Hearthstack Kitchen — Setup Wizard");
    btns.forEach(function(x){ x.setAttribute("aria-pressed", x.dataset.set===l?"true":"false"); });
    try{ localStorage.setItem("hs_lang",l); }catch(e){}
  }
  btns.forEach(function(x){ x.addEventListener("click",function(){ set(x.dataset.set); }); });
  addPerson(); setGeo();
  var saved=null; try{ saved=localStorage.getItem("hs_lang"); }catch(e){}
  set(saved || (/^zh/i.test(navigator.language||"")?"zh":"en"));
})();
</script>
